<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#122942 0,#081321 48%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{padding:26px 18px 18px;border-bottom:1px solid var(--line);background:#091726d9}.wrap{max-width:1240px;margin:auto;padding:0 18px}.eyebrow{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--cyan)}h1{margin:5px 0;font-size:clamp(25px,4vw,38px);letter-spacing:-1px}.subtitle{color:var(--muted);font-size:12px;letter-spacing:1.8px}.league-tabs{display:flex;gap:8px;margin:20px 0 16px}.league-tab,.filter,.action{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:10px;font-weight:750;cursor:pointer}.league-tab.active{background:#173d5e;border-color:#3479ae;color:white;box-shadow:inset 0 0 0 1px #56a8e855}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 10px #54d69a88}.actions{display:flex;gap:8px}.action{padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric,.game,.empty{background:linear-gradient(145deg,#12243a,#0e1c2d);border:1px solid var(--line);border-radius:14px}.metric{padding:14px}.metric-label,.label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:750}.metric-value{font-size:27px;font-weight:850;margin-top:4px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.filter{font-size:12px;padding:7px 12px}.filter.active{background:#1a3854;color:white;border-color:#3976a6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{padding:16px;min-width:0}.game.live{border-color:#3477a4;box-shadow:0 0 0 1px #3477a422}.game-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.game-status{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}.game-status.live{color:var(--green)}.clock{font-size:12px;color:var(--cyan);font-weight:800;text-align:right}.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:8px 0}.team-name{font-weight:750}.record{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}.score{font-size:27px;font-weight:850;font-variant-numeric:tabular-nums}.score.leading{color:var(--cyan)}.divider{height:1px;background:var(--line);margin:8px 0 12px}.analysis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.analysis-cell{background:#0a1726;border:1px solid #20364e;border-radius:9px;padding:9px}.analysis-cell .value{font-size:17px;font-weight:800;margin-top:3px}.value.good{color:var(--green)}.value.warn{color:var(--amber)}.momentum{margin-top:10px;padding:10px;background:#0a1726;border-radius:9px;color:var(--muted);font-size:12px}.momentum strong{color:var(--text)}.scoring{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:10px;padding:3px 6px;border-radius:5px;background:#1b3851;color:#b8d8f0}.empty{padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.foot{padding:28px 0 34px;text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px}.foot b{color:var(--cyan)}
@media(max-width:760px){.games{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.analysis{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 12px}.game{padding:13px}}

.flow-chart-wrap{margin-top:12px;padding:11px 10px 8px;background:#0a1726;border:1px solid #20364e;border-radius:10px}

<body>
<header><div class="wrap"><div class="eyebrow">LIVE BASKETBALL ANALYTICS</div><h1>GAME FLOW <span style="color:var(--cyan)">INTELLIGENCE</span></h1><div class="subtitle">LIVE SCORING FLOW • OVER/UNDER ANALYSIS</div></div></header>
<main class="wrap">
  <nav class="league-tabs" aria-label="League selection"><button class="league-tab active" data-league="ncaa">NCAA MEN'S</button><button class="league-tab" data-league="nba">NBA</button></nav>
  <div class="toolbar"><div class="status"><span class="dot"></span><span id="updateStatus">Connecting to ESPN…</span><span id="historyStatus" style="margin-left:10px"></span></div><div class="actions"><button class="action" id="exportHistoryButton">↓ Export Log</button><button class="action" id="refreshButton">↻ Refresh</button></div></div>
  <section class="metrics"><div class="metric"><div class="metric-label">Games Today</div><div class="metric-value" id="gamesTracked">—</div></div><div class="metric"><div class="metric-label">Live Games</div><div class="metric-value" id="liveGames">—</div></div><div class="metric"><div class="metric-label">Model Projections</div><div class="metric-value" id="modelProjections">—</div></div></section>
  <div class="filters"><button class="filter active" data-filter="all">All Games</button><button class="filter" data-filter="live">Live</button><button class="filter" data-filter="upcoming">Upcoming</button><button class="filter" data-filter="final">Final</button></div>
  <div class="section-head"><h2 id="boardTitle">NCAA Men's Game Monitor</h2><span id="gameCount">0 games</span></div>
  <section class="games" id="games"><div class="empty">Loading scoreboard…</div></section>
  <div class="foot">GAME FLOW INTELLIGENCE <b>•</b> NBA + NCAA MEN'S</div>
</main>
<script type="module">
import { projectLiveTotal } from '/lib/total-model.js';
const REFRESH_MS=5000;const DETAILS_REFRESH_MS=30000;const HISTORY_KEY='gfi_model_history_v1';const MAX_HISTORY_ROWS=12000;let league='ncaa',filter='all',games=[];
const rawLeagueGames={nba:[],ncaa:[]},leagueGames={nba:[],ncaa:[]};
const detailCache={nba:{},ncaa:{}},lastDetailsFetch={nba:0,ncaa:0};
const scoreboardLoading={nba:false,ncaa:false},detailsLoading={nba:false,ncaa:false};
const lastHistoryCapture={nba:0,ncaa:0};
const $=id=>document.getElementById(id);const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
function readHistory(){try{const rows=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(rows)?rows:[]}catch(e){console.warn('History log could not be read',e);return []}}
function writeHistory(rows){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(rows.slice(-MAX_HISTORY_ROWS)));return true}catch(e){console.warn('History log storage is full or unavailable',e);return false}}
function updateHistoryStatus(){const rows=readHistory();const snapshots=rows.filter(row=>row.kind==='snapshot').length;$('historyStatus').textContent=`· ${snapshots.toLocaleString()} snapshots saved in this browser`}
function captureHistory(currentGames,currentLeague){
  const rows=readHistory();const knownFinals=new Set(rows.filter(row=>row.kind==='final').map(row=>`${row.league}:${row.eventId}`));
  const now=new Date().toISOString();let changed=false;
  for(const g of currentGames){
    const key=`${currentLeague}:${g.id}`;const state=statusOf(g);
    if(state==='live'){
      const model=g.totalProjection||{};const latest=[...rows].reverse().find(row=>row.kind==='snapshot'&&row.league===currentLeague&&String(row.eventId)===String(g.id));
      if(latest&&latest.clock===g.clock&&latest.period===g.period&&latest.homeScore===n(g.home.score)&&latest.awayScore===n(g.away.score))continue;
      rows.push({kind:'snapshot',capturedAt:now,league:currentLeague,eventId:String(g.id),gameDate:g.date||'',awayTeam:g.away.name,homeTeam:g.home.name,period:n(g.period),clock:g.clock||'',homeScore:n(g.home.score),awayScore:n(g.away.score),combinedScore:n(g.home.score)+n(g.away.score),modelTotal:model.total??null,modelMethod:model.method||'',modelSample:model.sample||'',possessionsPerTeam:model.possessionsPerTeam??null,projectedRemainingPossessions:model.projectedRemainingPossessions??null,homePPP:model.homePPP??null,awayPPP:model.awayPPP??null});
      changed=true;
    }else if(state==='final'&&!knownFinals.has(key)){
      rows.push({kind:'final',capturedAt:now,league:currentLeague,eventId:String(g.id),gameDate:g.date||'',awayTeam:g.away.name,homeTeam:g.home.name,homeScore:n(g.home.score),awayScore:n(g.away.score),finalTotal:n(g.home.score)+n(g.away.score)});
      knownFinals.add(key);changed=true;
    }
  }
  if(changed&&!writeHistory(rows)){
    const reduced=rows.slice(-Math.floor(MAX_HISTORY_ROWS/2));
    if(writeHistory(reduced))$('historyStatus').textContent='· Log trimmed to fit browser storage';

}
function exportHistory(){
  const rows=readHistory();if(!rows.length){$('historyStatus').textContent='· No history recorded yet';return}
  const finals=new Map(rows.filter(row=>row.kind==='final').map(row=>[`${row.league}:${row.eventId}`,row]));
  const columns=['capturedAt','league','eventId','awayTeam','homeTeam','period','clock','awayScore','homeScore','combinedScore','modelTotal','finalTotal','projectionError','absoluteError','modelMethod','modelSample','possessionsPerTeam','projectedRemainingPossessions','homePPP','awayPPP'];
  const quote=value=>`"${String(value??'').replace(/"/g,'""')}"`;
  const output=[columns.join(',')];
  for(const row of rows.filter(item=>item.kind==='snapshot')){
    const final=finals.get(`${row.league}:${row.eventId}`);const finalTotal=final?.finalTotal??'';
    const error=final&&row.modelTotal!==null&&row.modelTotal!==undefined?Number(row.modelTotal)-Number(final.finalTotal):'';
    const values={...row,finalTotal,projectionError:error===''?'':Math.round(error*10)/10,absoluteError:error===''?'':Math.round(Math.abs(error)*10)/10};
    output.push(columns.map(column=>quote(values[column])).join(','));
  }
  const csv=output.join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`gfi-model-history-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
}
function clockSeconds(clock){const m=String(clock||'').match(/^(\d+):(\d+)$/);return m?Number(m[1])*60+Number(m[2]):null}
function elapsedSeconds(g){const p=n(g.period),rem=clockSeconds(g.clock);if(!p||rem===null)return null;const len=n(g.periodLengthSeconds),reg=n(g.regulationPeriods);if(p<=reg)return (p-1)*len+(len-rem);return reg*len+(p-reg-1)*5*60+(5*60-rem)}
function totalRegSeconds(g){return n(g.periodLengthSeconds)*n(g.regulationPeriods)}
function statusOf(g){return g.state==='in'?'live':g.state==='post'?'final':'upcoming'}
function statusLabel(g){const s=statusOf(g);return s==='live'?'LIVE':s==='final'?'FINAL':'UPCOMING'}
function fmtStartTime(g){
  if(!g.date)return 'TIME TBD';
  const d=new Date(g.date);
  if(Number.isNaN(d.getTime()))return 'TIME TBD';
  return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(d);
}
function fmtPeriod(g){
  const state=statusOf(g);
  if(state==='upcoming')return fmtStartTime(g);
  if(state==='final')return 'FINAL';
  const p=n(g.period),clock=g.clock||'—';
  if(!p)return clock;
  if(league==='nba')return p<=4?`${clock} Q${p}`:`${clock} OT${p-4}`;
  return p<=2?`${clock} H${p}`:`${clock} OT${p-2}`;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function record(team){return team.records?.find(r=>r.name==='overall')?.summary||''}
function scoreFlowChart(g){
  const clockToSeconds=clock=>{
    const match=String(clock||'').trim().match(/^(\\d+):(\\d{1,2})$/);
    if(!match)return null;
    const minutes=Number(match[1]),seconds=Number(match[2]);
    return seconds<=59?minutes*60+seconds:null;
  };
  const elapsedAt=(period,clock)=>{
    const p=n(period),remaining=clockToSeconds(clock);
    if(!p||remaining===null)return null;
    const periodLength=p>n(g.regulationPeriods)?300:n(g.periodLengthSeconds);
    if(p<=n(g.regulationPeriods))return (p-1)*n(g.periodLengthSeconds)+(periodLength-remaining);
    return n(g.regulationPeriods)*n(g.periodLengthSeconds)+(p-n(g.regulationPeriods)-1)*300+(300-remaining);
  };
  const points=(g.scoringEvents||[])
    .filter(event=>event.homeScore!==null&&event.awayScore!==null)
    .map(event=>({
      t:elapsedAt(event.period,event.clock),
      home:n(event.homeScore),
      away:n(event.awayScore),
      sequence:n(event.sequence)
    }))
    .filter(point=>point.t!==null)
    .sort((a,b)=>a.t-b.t||a.sequence-b.sequence);
  const currentTime=elapsedAt(g.period,g.clock);
  if(currentTime!==null&&(statusOf(g)==='live'||statusOf(g)==='final')){
    const last=points[points.length-1];
    if(!last||last.home!==n(g.home.score)||last.away!==n(g.away.score)||last.t<currentTime){
      points.push({t:currentTime,home:n(g.home.score),away:n(g.away.score),sequence:Number.MAX_SAFE_INTEGER});
    }
  }
  if(!points.length)return '<div class="flow-empty">Scoring timeline will appear when play-by-play is available.</div>';
  points.unshift({t:0,home:0,away:0,sequence:-1});
  const maxTime=Math.max(1,currentTime??points[points.length-1].t,points[points.length-1].t);
  const topScore=Math.max(10,...points.map(point=>Math.max(point.home,point.away)));
  const maxScore=Math.max(10,Math.ceil(topScore/10)*10);
  const left=30,right=305,top=12,bottom=106;
  const x=t=>left+(Math.max(0,Math.min(maxTime,t))/maxTime)*(right-left);
  const y=score=>bottom-(score/maxScore)*(bottom-top);
  const awayCoords=points.map(point=>`${x(point.t).toFixed(1)},${y(point.away).toFixed(1)}`).join(' ');
  const homeCoords=points.map(point=>`${x(point.t).toFixed(1)},${y(point.home).toFixed(1)}`).join(' ');
  const scoreTicks=[0,Math.round(maxScore/2),maxScore];
  const grid=scoreTicks.map(value=>{
    const py=y(value).toFixed(1);
    return `<line class="grid-line" x1="${left}" y1="${py}" x2="${right}" y2="${py}"/><text x="23" y="${Number(py)+3}" text-anchor="end">${value}</text>`;
  }).join('');
  const midX=x(maxTime/2);
  const nowX=x(maxTime);
  return `<div class="flow-chart-wrap">
    <div class="flow-chart-head"><span>SCORING FLOW</span><span>${points.length-1} scoring updates</span></div>
    <svg class="flow-chart" viewBox="0 0 320 132" role="img" aria-label="Cumulative score by game time: ${esc(g.away.name)} ${n(g.away.score)}, ${esc(g.home.name)} ${n(g.home.score)}">
      ${grid}
      <line class="grid-line" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"/>
      <polyline class="away-line" points="${awayCoords}"/>
      <polyline class="home-line" points="${homeCoords}"/>
      <circle cx="${x(points[points.length-1].t)}" cy="${y(points[points.length-1].away)}" r="3" fill="#72d5e8"/>
      <circle cx="${x(points[points.length-1].t)}" cy="${y(points[points.length-1].home)}" r="3" fill="#f3bd62"/>
      <text x="${left}" y="123" text-anchor="start">START</text>
      <text x="${midX}" y="123" text-anchor="middle">MID</text>
      <text x="${nowX}" y="123" text-anchor="end">${statusOf(g)==='final'?'FINAL':'NOW'}</text>
    </svg>
    <div class="flow-legend">
      <span class="flow-key"><i class="flow-swatch" style="background:#72d5e8"></i>${esc(g.away.name)} · ${n(g.away.score)}</span>
      <span class="flow-key"><i class="flow-swatch" style="background:#f3bd62"></i>${esc(g.home.name)} · ${n(g.home.score)}</span>
    </div>
  </div>`;
}
function card(g){
  const state=statusOf(g),flow=recentFlow(g),model=g.totalProjection||null;
  const projectedTotal=model?.total!==null&&model?.total!==undefined&&Number.isFinite(Number(model.total))?Number(model.total):null;
  const projectedMargin=model?.projectedHomeMargin!==null&&model?.projectedHomeMargin!==undefined&&Number.isFinite(Number(model.projectedHomeMargin))?Number(model.projectedHomeMargin):null;
  const marginText=projectedMargin===null?'—':Math.abs(projectedMargin)<0.05?'Even':projectedMargin>0?`${g.home.name} by ${Math.abs(projectedMargin).toFixed(1)}`:`${g.away.name} by ${Math.abs(projectedMargin).toFixed(1)}`;

  const hasPossessions=possessions!==null&&possessions!==undefined&&Number.isFinite(Number(possessions));

  const homeLead=n(g.home.score)>n(g.away.score),awayLead=n(g.away.score)>n(g.home.score);
  return `<article class="game ${state==='live'?'live':''}"><div class="game-head"><div class="game-status ${state==='live'?'live':''}">${statusLabel(g)}</div><div class="clock">${esc(fmtPeriod(g))}</div></div><div class="team"><div><div class="team-name">${esc(g.away.name)}<span class="record">${esc(record(g.away))}</span></div></div><div class="score ${awayLead?'leading':''}">${n(g.away.score)}</div></div><div class="team"><div><div class="team-name">${esc(g.home.name)}<span class="record">${esc(record(g.home))}</span></div></div><div class="score ${homeLead?'leading':''}">${n(g.home.score)}</div></div><div class="divider"></div><div class="analysis"><div class="analysis-cell"><div class="label">Live combined score</div><div class="value">${state==='upcoming'?'—':n(g.home.score)+n(g.away.score)}</div></div><div class="analysis-cell"><div class="label">Model projection</div><div class="value">${projectedTotal===null?'—':projectedTotal}</div></div><div class="analysis-cell"><div class="label">Model projected margin</div><div class="value">${esc(marginText)}</div></div><div class="analysis-cell"><div class="label">Estimated possessions remaining</div><div class="value">${hasPossessions?possessions:'—'}</div></div><div class="analysis-cell"><div class="label">Home / away PPP</div><div class="value">${ppp}</div></div></div>${scoreFlowChart(g)}</div></article>`
}
function render(){let list=[...games];if(filter==='live')list=list.filter(g=>statusOf(g)==='live');if(filter==='upcoming')list=list.filter(g=>statusOf(g)==='upcoming');if(filter==='final')list=list.filter(g=>statusOf(g)==='final');list.sort((a,b)=>{const rank=g=>statusOf(g)==='live'?0:statusOf(g)==='upcoming'?1:2;return rank(a)-rank(b)||new Date(a.date)-new Date(b.date)});$('gameCount').textContent=`${list.length} games`;$('games').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No games in this view right now.</div>';}
function metrics(){$('gamesTracked').textContent=games.length;const live=games.filter(g=>statusOf(g)==='live');$('liveGames').textContent=live.length;$('modelProjections').textContent=live.filter(g=>g.totalProjection?.total!==null&&g.totalProjection?.total!==undefined&&Number.isFinite(Number(g.totalProjection.total))).length;}
function decorateGame(raw,key){
  const detail=detailCache[key][String(raw.id)]||{};
  const home={...raw.home,stats:detail.homeStats||{}};
  const away={...raw.away,stats:detail.awayStats||{}};
  const totalProjection=projectLiveTotal({
    league:key,
    state:raw.state||"",
    period:raw.period||0,
    clock:raw.clock||"",
    periodLengthSeconds:raw.periodLengthSeconds,
    regulationPeriods:raw.regulationPeriods,
    home,
    away
  });
  return {...raw,home,away,totalProjection,
    scoringEvents:detail.scoringEvents||[],
    playEvents:detail.playEvents||[]};
}
function presentLeague(key){
  leagueGames[key]=rawLeagueGames[key].map(raw=>decorateGame(raw,key));
  if(key===league)games=leagueGames[key];
}
function maybeCaptureHistory(key){
  const now=Date.now();
  if(now-lastHistoryCapture[key]<DETAILS_REFRESH_MS)return;
  captureHistory(leagueGames[key],key);
  lastHistoryCapture[key]=now;
}
function updateBoard(){metrics();render();}
async function refreshScoreboard(key,showBoard=false){
  if(scoreboardLoading[key])return;
  scoreboardLoading[key]=true;
  if(showBoard)$('updateStatus').textContent=`Updating ${key.toUpperCase()} scoreboard…`;
  try{
    const response=await fetch(`/api/scores?league=${key}`,{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}
    });
    if(!response.ok)throw new Error(`${key.toUpperCase()} score API returned ${response.status}`);
    const data=await response.json();
    if(!Array.isArray(data.games))throw new Error(data.details||'Missing games array');
    rawLeagueGames[key]=data.games;
    presentLeague(key);
    maybeCaptureHistory(key);
    if(showBoard&&key===league){
      updateBoard();
      $('updateStatus').textContent=`ESPN feed · Updated ${new Date(data.updated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`;
      $('boardTitle').textContent=key==='nba'?'NBA Game Monitor':"NCAA Men's Game Monitor";
    }
    if(Date.now()-lastDetailsFetch[key]>=DETAILS_REFRESH_MS)void refreshDetails(key);
  }catch(error){
    console.error(error);
    if(showBoard)$('updateStatus').textContent='Scoreboard update failed';
    if(showBoard&&!games.length)$('games').innerHTML=`<div class="empty">Unable to load the ${key.toUpperCase()} scoreboard. Check the /api/scores endpoint.</div>`;
  }finally{
    scoreboardLoading[key]=false;
  }
}
async function refreshDetails(key,force=false){
  if(detailsLoading[key])return;
  const eventIds=rawLeagueGames[key].filter(game=>game.state==='in').map(game=>String(game.id));
  if(!eventIds.length)return;
  if(!force&&Date.now()-lastDetailsFetch[key]<DETAILS_REFRESH_MS)return;
  detailsLoading[key]=true;
  lastDetailsFetch[key]=Date.now();
  try{
    const params=new URLSearchParams({league:key,events:eventIds.join(',')});
    const response=await fetch(`/api/details?${params.toString()}`,{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}
    });
    if(!response.ok)throw new Error(`${key.toUpperCase()} detail API returned ${response.status}`);
    const data=await response.json();
    Object.assign(detailCache[key],data.details||{});
    presentLeague(key);
    if(key===league)updateBoard();
  }catch(error){
    console.warn(`Background ${key.toUpperCase()} detail refresh failed`,error);
  }finally{
    detailsLoading[key]=false;
  }
}
function loadGames(){
  refreshScoreboard(league,true);
  const other=league==='nba'?'ncaa':'nba';
  if(!rawLeagueGames[other].length)refreshScoreboard(other,false);
  refreshDetails(league,true);
}
function startLiveRefresh(){
  refreshScoreboard('ncaa',true);
  refreshScoreboard('nba',false);
  setInterval(()=>refreshScoreboard(league,true),REFRESH_MS);
  setInterval(()=>{
    const other=league==='nba'?'ncaa':'nba';
    refreshScoreboard(other,false);
    refreshDetails('nba');
    refreshDetails('ncaa');
    maybeCaptureHistory('nba');
    maybeCaptureHistory('ncaa');
  },DETAILS_REFRESH_MS);
}
document.querySelectorAll('.league-tab').forEach(b=>b.addEventListener('click',()=>{
  if(league===b.dataset.league)return;
  league=b.dataset.league;
  document.querySelectorAll('.league-tab').forEach(x=>x.classList.toggle('active',x===b));
  games=leagueGames[league];
  if(games.length)updateBoard();else{$('games').innerHTML='<div class="empty">Loading scoreboard…</div>';metrics();}
  loadGames();
}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));
  render();
}));
$('refreshButton').addEventListener('click',loadGames);
$('exportHistoryButton').addEventListener('click',exportHistory);
updateHistoryStatus();
startLiveRefresh();
</script>
</body>
