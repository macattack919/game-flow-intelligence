<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081321">
<title>Game Flow Intelligence</title>
<style>
:root{--bg:#081321;--panel:#101f32;--panel2:#152941;--line:#263b53;--text:#edf4fb;--muted:#91a5bb;--blue:#56a8e8;--cyan:#72d5e8;--green:#54d69a;--amber:#f3bd62;--red:#f07878}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#122942 0,#081321 48%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{padding:26px 18px 18px;border-bottom:1px solid var(--line);background:#091726d9}.wrap{max-width:1240px;margin:auto;padding:0 18px}.eyebrow{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--cyan)}h1{margin:5px 0;font-size:clamp(25px,4vw,38px);letter-spacing:-1px}.subtitle{color:var(--muted);font-size:12px;letter-spacing:1.8px}.league-tabs{display:flex;gap:8px;margin:20px 0 16px}.league-tab,.filter,.action{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:10px;font-weight:750;cursor:pointer}.league-tab.active{background:#173d5e;border-color:#3479ae;color:white;box-shadow:inset 0 0 0 1px #56a8e855}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 10px #54d69a88}.actions{display:flex;gap:8px}.action{padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric,.game,.empty{background:linear-gradient(145deg,#12243a,#0e1c2d);border:1px solid var(--line);border-radius:14px}.metric{padding:14px}.metric-label,.label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:750}.metric-value{font-size:27px;font-weight:850;margin-top:4px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.filter{font-size:12px;padding:7px 12px}.filter.active{background:#1a3854;color:white;border-color:#3976a6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{padding:16px;min-width:0}.game.live{border-color:#3477a4;box-shadow:0 0 0 1px #3477a422}.game-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.game-status{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}.game-status.live{color:var(--green)}.clock{font-size:12px;color:var(--cyan);font-weight:800;text-align:right}.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:8px 0}.team-name{font-weight:750}.record{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}.score{font-size:27px;font-weight:850;font-variant-numeric:tabular-nums}.score.leading{color:var(--cyan)}.divider{height:1px;background:var(--line);margin:8px 0 12px}.analysis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.analysis-cell{background:#0a1726;border:1px solid #20364e;border-radius:9px;padding:9px}.analysis-cell .value{font-size:17px;font-weight:800;margin-top:3px}.value.good{color:var(--green)}.value.warn{color:var(--amber)}.momentum{margin-top:10px;padding:10px;background:#0a1726;border-radius:9px;color:var(--muted);font-size:12px}.momentum strong{color:var(--text)}.scoring{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:10px;padding:3px 6px;border-radius:5px;background:#1b3851;color:#b8d8f0}.empty{padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.foot{padding:28px 0 34px;text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px}.foot b{color:var(--cyan)}
@media(max-width:760px){.games{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.analysis{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 12px}.game{padding:13px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">LIVE BASKETBALL ANALYTICS</div><h1>GAME FLOW <span style="color:var(--cyan)">INTELLIGENCE</span></h1><div class="subtitle">SCORING FLOW • TOTALS • SPREADS • COMEBACKS</div></div></header>
<main class="wrap">
  <nav class="league-tabs" aria-label="League selection"><button class="league-tab active" data-league="nba">NBA</button><button class="league-tab" data-league="ncaa">NCAA MEN'S</button></nav>
  <div class="toolbar"><div class="status"><span class="dot"></span><span id="updateStatus">Connecting to ESPN…</span></div><div class="actions"><button class="action" id="refreshButton">↻ Refresh</button></div></div>
  <section class="metrics"><div class="metric"><div class="metric-label">Games Today</div><div class="metric-value" id="gamesTracked">—</div></div><div class="metric"><div class="metric-label">Live Games</div><div class="metric-value" id="liveGames">—</div></div><div class="metric"><div class="metric-label">Comeback Watch</div><div class="metric-value" id="comebackGames">—</div></div><div class="metric"><div class="metric-label">High-Pace Games</div><div class="metric-value" id="paceGames">—</div></div></section>
  <div class="filters"><button class="filter active" data-filter="all">All Games</button><button class="filter" data-filter="live">Live</button><button class="filter" data-filter="upcoming">Upcoming</button><button class="filter" data-filter="final">Final</button></div>
  <div class="section-head"><h2 id="boardTitle">NBA Game Monitor</h2><span id="gameCount">0 games</span></div>
  <section class="games" id="games"><div class="empty">Loading scoreboard…</div></section>
  <div class="foot">GAME FLOW INTELLIGENCE <b>•</b> NBA + NCAA MEN'S</div>
</main>
<script>
const REFRESH_MS=30000;let league='nba',filter='all',games=[],loading=false;
const $=id=>document.getElementById(id);const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
function clockSeconds(clock){const m=String(clock||'').match(/^(\d+):(\d+)$/);return m?Number(m[1])*60+Number(m[2]):null}
function elapsedSeconds(g){const p=n(g.period),rem=clockSeconds(g.clock);if(!p||rem===null)return null;const len=n(g.periodLengthSeconds),reg=n(g.regulationPeriods);if(p<=reg)return (p-1)*len+(len-rem);return reg*len+(p-reg-1)*5*60+(5*60-rem)}
function totalRegSeconds(g){return n(g.periodLengthSeconds)*n(g.regulationPeriods)}
function statusOf(g){return g.state==='in'?'live':g.state==='post'?'final':'upcoming'}
function fmtPeriod(g){const p=n(g.period);if(!p)return g.status||'Scheduled';if(league==='nba')return p<=4?`Q${p} · ${g.clock||'—'}`:`OT${p-4} · ${g.clock||'—'}`;return p===1?`1H · ${g.clock||'—'}`:p===2?`2H · ${g.clock||'—'}`:`OT${p-2} · ${g.clock||'—'}`}
function pace(g){const elapsed=elapsedSeconds(g),total=totalRegSeconds(g),score=g.home.score+g.away.score;if(elapsed===null||elapsed<60)return null;const fraction=Math.min(1,elapsed/total);return Math.round(score/fraction)}
function teamProjection(g,side){const elapsed=elapsedSeconds(g),total=totalRegSeconds(g);if(elapsed===null||elapsed<60)return null;const score=n(g[side].score);return Math.round(score/(elapsed/total))}
function recentFlow(g){const events=(g.scoringEvents||[]).filter(e=>e.homeScore!==null&&e.awayScore!==null);if(events.length<2)return {text:'Play-by-play trend not available yet',chips:[]};const latest=events[events.length-1];const p=n(latest.period),sec=clockSeconds(latest.clock);if(sec===null)return {text:'Scoring events received; game-clock trend unavailable',chips:[]};const len=n(g.periodLengthSeconds),reg=n(g.regulationPeriods);const now=(p-1)*len+(len-sec);const cutoff=now-5*60;const prior=[...events].reverse().find(e=>{const ep=n(e.period),es=clockSeconds(e.clock);return es!==null&&((ep-1)*len+(len-es))<=cutoff});const startHome=prior?.homeScore??0,startAway=prior?.awayScore??0;const dh=n(latest.homeScore)-n(startHome),da=n(latest.awayScore)-n(startAway);let text='Even scoring over recent window';if(dh>da)text=`Home team +${dh-da} over recent window`;if(da>dh)text=`Away team +${da-dh} over recent window`;return {text,chips:events.slice(-4).map(e=>`${e.points||''} pt${e.points===1?'':'s'} · ${e.clock||''}`)}}
function isComeback(g){if(statusOf(g)!=='live')return false;const diff=Math.abs(n(g.home.score)-n(g.away.score));const elapsed=elapsedSeconds(g);return diff>=8&&elapsed!==null&&elapsed<totalRegSeconds(g)*.72}
function isHighPace(g){const projected=pace(g);return statusOf(g)==='live'&&projected!==null&&projected>(league==='nba'?230:150)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function record(team){return team.records?.find(r=>r.name==='overall')?.summary||''}
function card(g){const state=statusOf(g),total=pace(g),hp=teamProjection(g,'home'),ap=teamProjection(g,'away'),margin=hp===null||ap===null?null:hp-ap,flow=recentFlow(g);const comeback=isComeback(g);const homeLead=n(g.home.score)>n(g.away.score),awayLead=n(g.away.score)>n(g.home.score);return `<article class="game ${state==='live'?'live':''}"><div class="game-head"><div class="game-status ${state==='live'?'live':''}">${comeback?'⚑ COMEBACK WATCH':esc(g.status||state.toUpperCase())}</div><div class="clock">${esc(fmtPeriod(g))}</div></div><div class="team"><div><div class="team-name">${esc(g.away.name)}<span class="record">${esc(record(g.away))}</span></div></div><div class="score ${awayLead?'leading':''}">${n(g.away.score)}</div></div><div class="team"><div><div class="team-name">${esc(g.home.name)}<span class="record">${esc(record(g.home))}</span></div></div><div class="score ${homeLead?'leading':''}">${n(g.home.score)}</div></div><div class="divider"></div><div class="analysis"><div class="analysis-cell"><div class="label">Pace total</div><div class="value">${total===null?'—':total}</div></div><div class="analysis-cell"><div class="label">Away team pace</div><div class="value">${ap===null?'—':ap}</div></div><div class="analysis-cell"><div class="label">Home team pace</div><div class="value">${hp===null?'—':hp}</div></div><div class="analysis-cell"><div class="label">Projected margin</div><div class="value ${margin!==null&&Math.abs(margin)>=10?'warn':''}">${margin===null?'—':`${margin>0?'+':''}${margin}`}</div></div><div class="analysis-cell"><div class="label">Scoring events</div><div class="value">${(g.scoringEvents||[]).length||'—'}</div></div><div class="analysis-cell"><div class="label">Stats feed</div><div class="value ${(g.statsAvailable)?'good':'warn'}">${g.statsAvailable?'Available':'Pending'}</div></div></div><div class="momentum"><strong>Scoring flow:</strong> ${esc(flow.text)}${flow.chips.length?`<div class="scoring">${flow.chips.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}</div></article>`}
function render(){let list=[...games];if(filter==='live')list=list.filter(g=>statusOf(g)==='live');if(filter==='upcoming')list=list.filter(g=>statusOf(g)==='upcoming');if(filter==='final')list=list.filter(g=>statusOf(g)==='final');list.sort((a,b)=>{const rank=g=>isComeback(g)?0:statusOf(g)==='live'?1:statusOf(g)==='upcoming'?2:3;return rank(a)-rank(b)||new Date(a.date)-new Date(b.date)});$('gameCount').textContent=`${list.length} games`;$('games').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No games in this view right now.</div>';}
function metrics(){$('gamesTracked').textContent=games.length;$('liveGames').textContent=games.filter(g=>statusOf(g)==='live').length;$('comebackGames').textContent=games.filter(isComeback).length;$('paceGames').textContent=games.filter(isHighPace).length}
async function loadGames(){if(loading)return;loading=true;$('refreshButton').disabled=true;$('updateStatus').textContent=`Updating ${league.toUpperCase()} scoreboard…`;try{const r=await fetch(`/api/scores?league=${league}`,{cache:'no-store'});if(!r.ok)throw new Error(`Score API returned ${r.status}`);const data=await r.json();if(!Array.isArray(data.games))throw new Error(data.details||'Missing games array');games=data.games;metrics();render();$('updateStatus').textContent=`ESPN feed · Updated ${new Date(data.updated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`;$('boardTitle').textContent=league==='nba'?'NBA Game Monitor':"NCAA Men's Game Monitor"}catch(e){console.error(e);$('updateStatus').textContent='Scoreboard update failed';if(!games.length)$('games').innerHTML=`<div class="empty">Unable to load the ${league.toUpperCase()} scoreboard. Check the /api/scores endpoint.</div>`}finally{loading=false;$('refreshButton').disabled=false}}
document.querySelectorAll('.league-tab').forEach(b=>b.addEventListener('click',()=>{if(league===b.dataset.league)return;league=b.dataset.league;games=[];document.querySelectorAll('.league-tab').forEach(x=>x.classList.toggle('active',x===b));metrics();$('games').innerHTML='<div class="empty">Loading scoreboard…</div>';loadGames()}));document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));$('refreshButton').addEventListener('click',loadGames);loadGames();setInterval(loadGames,REFRESH_MS);
</script>
</body>
</html>
